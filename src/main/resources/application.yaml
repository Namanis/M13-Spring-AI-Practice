spring:
  application:
    name: springai-bootcamp-demo
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:chatbot.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      custom-headers:
        HTTP-Referer: ${OPENROUTER_REFERER:http://localhost:8080}
        X-OpenRouter-Title: ${OPENROUTER_TITLE:SpringAI Bootcamp ChatBot}
      chat:
        model: ${OPENROUTER_MODEL:meta-llama/llama-3.2-3b-instruct}

openrouter:
  system-prompt: ${OPENROUTER_SYSTEM_PROMPT:You teach unit testing to junior Java developers. When the user pastes code, first list in 3 bullet points what should be tested and why. Don't say answer right away. Point to correct solution by giving advices.}